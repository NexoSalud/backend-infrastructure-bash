services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: nexosalud-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexosalud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexosalud"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexo-network

  # Migración de BD — corre una sola vez antes de que billing arranque
  db-migrate:
    image: postgres:15
    container_name: nexosalud-db-migrate
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./init-scripts:/scripts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexo-network
    restart: "no"
    command: >
      sh -c "psql -h postgres -U postgres -d nexosalud -f /scripts/02-billing-migrate.sql && psql -h postgres -U postgres -d nexosalud -f /scripts/03-ebs-seed.sql && psql -h postgres -U postgres -d nexosalud -f /scripts/04-ebs-permissions.sql && psql -h postgres -U postgres -d nexosalud -f /scripts/06-autorizacion-schema.sql"

  # Users Service
  users-service:
    build:
      context: ./backend-module-users
      dockerfile: Dockerfile
    container_name: nexosalud-users
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8081
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/nexosalud
      - SPRING_R2DBC_USERNAME=postgres
      - SPRING_R2DBC_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexo-network
    restart: unless-stopped

  # Employees Service
  employees-service:
    build:
      context: ./backend-module-employees
      dockerfile: Dockerfile
    container_name: nexosalud-employees
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8082
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/nexosalud
      - SPRING_R2DBC_USERNAME=postgres
      - SPRING_R2DBC_PASSWORD=postgres
      - JWT_SECRET=mySecretKeyForJWTTokenGenerationAndValidation1234567890
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USERNAME=${EMAIL_USERNAME:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-no-reply@nexosalud.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexo-network
    restart: unless-stopped

  # Schedule Service
  schedule-service:
    build:
      context: ./backend-module-schedule
      dockerfile: Dockerfile
    container_name: nexosalud-schedule
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8083
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/nexosalud
      - SPRING_R2DBC_USERNAME=postgres
      - SPRING_R2DBC_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexo-network
    restart: unless-stopped

  # Appointments Service
  appointments-service:
    build:
      context: ./backend-module-appointments
      dockerfile: Dockerfile
    container_name: nexosalud-appointments
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8084
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/nexosalud
      - SPRING_R2DBC_USERNAME=postgres
      - SPRING_R2DBC_PASSWORD=postgres
      - APPOINTMENT_DEFAULT_DURATION=20
      - VALIDATION_MOCK_MODE=true
    networks:
      - nexo-network
    restart: unless-stopped

  # Convenios Service
  convenios-service:
    build:
      context: ./backend-module-convenios
      dockerfile: Dockerfile
    container_name: nexosalud-convenios
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8086
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/nexosalud
      - SPRING_R2DBC_USERNAME=postgres
      - SPRING_R2DBC_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexo-network
    restart: unless-stopped

  # SIAU Service (PQRSDF)
  siau-service:
    build:
      context: ./backend-module-siau
      dockerfile: Dockerfile
    container_name: nexosalud-siau
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8088
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/nexosalud
      - SPRING_R2DBC_USERNAME=postgres
      - SPRING_R2DBC_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexo-network
    restart: unless-stopped

  # History Template Service
  history-template-service:
    build:
      context: ./backend-history-template
      dockerfile: Dockerfile
    container_name: nexosalud-history-template
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8085
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/nexosalud
      - SPRING_R2DBC_USERNAME=postgres
      - SPRING_R2DBC_PASSWORD=postgres
    networks:
      - nexo-network
    restart: unless-stopped

  # EBS Contracts Service
  ebs-contracts-service:
    build:
      context: ./backend-module-ebs-contracts
      dockerfile: Dockerfile
    container_name: nexosalud-ebs-contracts
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8089
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/nexosalud
      - SPRING_R2DBC_USERNAME=postgres
      - SPRING_R2DBC_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexo-network
    restart: unless-stopped

  # Autorización y Agendamiento Service
  autorizacion-service:
    build:
      context: ./backend-module-autorizacion
      dockerfile: Dockerfile
    container_name: nexosalud-autorizacion
    environment:
      - SERVICE_PORT=8090
      - DATABASE_URL=postgresql://postgres:5432/nexosalud
      - DATABASE_USER=postgres
      - DATABASE_PASS=postgres
      - JWT_SECRET=mySecretKeyForJWTTokenGenerationAndValidation1234567890
      - PDF_OUTPUT_DIR=/app/pdfs_autorizaciones
    volumes:
      - auth_pdfs_data:/app/pdfs_autorizaciones
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - nexo-network
    restart: unless-stopped

  # Billing / Recaudo Service
  billing-service:
    build:
      context: ./backend-module-billing
      dockerfile: Dockerfile
    container_name: nexosalud-billing
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8087
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/nexosalud
      - SPRING_R2DBC_USERNAME=postgres
      - SPRING_R2DBC_PASSWORD=postgres
      - USERS_SERVICE_URL=http://users-service:8081
      - APPOINTMENTS_SERVICE_URL=http://appointments-service:8084
      - HISTORY_TEMPLATE_SERVICE_URL=http://history-template-service:8085
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - nexo-network
    restart: unless-stopped

  # Gateway Service (Only service exposed to host)
  gateway-service:
    build:
      context: ./backend-module-gateway
      dockerfile: Dockerfile
    container_name: nexosalud-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/nexosalud
      - SPRING_R2DBC_USERNAME=postgres
      - SPRING_R2DBC_PASSWORD=postgres
      - JWT_SECRET=mySecretKeyForJWTTokenGenerationAndValidation1234567890
      - AUTH_MOCK_MODE=false
      # Internal service URLs (using container names)
      - USERS_SERVICE_URL=http://users-service:8081
      - EMPLOYEES_SERVICE_URL=http://employees-service:8082
      - SCHEDULE_SERVICE_URL=http://schedule-service:8083
      - APPOINTMENTS_SERVICE_URL=http://appointments-service:8084
      - HISTORY_TEMPLATE_SERVICE_URL=http://history-template-service:8085
      - CONVENIOS_SERVICE_URL=http://convenios-service:8086
      - BILLING_SERVICE_URL=http://billing-service:8087
      - SIAU_SERVICE_URL=http://siau-service:8088
      - EBS_CONTRACTS_SERVICE_URL=http://ebs-contracts-service:8089
      - AUTORIZACION_SERVICE_URL=http://autorizacion-service:8090
    ports:
      - "8080:8080"  # Only the gateway is exposed to the host
    depends_on:
      postgres:
        condition: service_healthy
      users-service:
        condition: service_started
      employees-service:
        condition: service_started
      schedule-service:
        condition: service_started
      appointments-service:
        condition: service_started
      history-template-service:
        condition: service_started
      convenios-service:
        condition: service_started
      billing-service:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
      siau-service:
        condition: service_started
      ebs-contracts-service:
        condition: service_started
      autorizacion-service:
        condition: service_started
    networks:
      - nexo-network
    restart: unless-stopped

networks:
  nexo-network:
    driver: bridge

volumes:
  pgdata:
  auth_pdfs_data: